    function renderRituals() {
      const grid = document.getElementById('ritualsGrid');
      grid.innerHTML = ritualsData.map(r => `
        <a href="items/${r.id}.html" class="ritual-item ${r.part}">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="ritual-num">NO.${String(r.id).padStart(3, '0')}</span>
            <span class="tag ${r.type.includes('오디오') ? 'tag-audio' : r.type.includes('글쓰기') ? 'tag-write' : r.type.includes('타이머') ? 'tag-timer' : 'tag-canvas'}">${r.type}</span>
          </div>
          <div class="ritual-title">${r.title}</div>
          <div class="ritual-desc">${r.target}</div>
          <span class="preview-btn">▶️ NO.${r.id} Clean White 실행 화면 열기</span>
        </a>
      `).join('');
    }

    function filterPart(partName) {
      const items = document.querySelectorAll('.ritual-item');
      items.forEach(item => {
        if (partName === 'all' || item.classList.contains(partName)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    window.onload = renderRituals;
  </script>
